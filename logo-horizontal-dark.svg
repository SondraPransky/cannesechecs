<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cannes Échecs — Logo horizontal
  VERSION FOND SOMBRE — usage principal en header de navigation
  Largeur : 280px · Hauteur : 88px
  Marque à gauche (mise à l'échelle 0.42), texte à droite
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 88"
     role="img" aria-labelledby="logo-h-title">
  <title id="logo-h-title">Cannes Échecs</title>

  <!-- ══ MARQUE (mise à l'échelle dans 82×88 à gauche) ══
       Transformation : scale(0.42) puis décalage pour centrage
       Mark original : x=38-162 (w≈124), y=20-194 (h≈174)
       À 0.42× : w≈52, h≈73 — centré dans 82×88
  -->
  <g fill="#C9A84C"
     transform="translate(15, 7) scale(0.42)">
    <path d="M98.5,80 C97.5,61 96.5,42 100,20
             C103.5,42 102.5,61 101.5,80 Z"/>
    <path d="M99,80 C89,65 74,48 62,36
             C70.5,46 86,63 101,79 Z"/>
    <path d="M99,79 C114,63 129.5,46 138,36
             C126,48 111,65 101,80 Z"/>
    <path d="M98,80 C82.5,71.5 62,64 38,61
             C61,59 80.5,67.5 102,78.5 Z"/>
    <path d="M98,78.5 C119.5,67.5 139,59 162,61
             C138,64 117.5,71.5 102,80 Z"/>
    <rect x="97.5" y="79" width="5" height="21"/>
    <circle cx="100" cy="112" r="13"/>
    <rect x="92"  y="127" width="16" height="5"/>
    <rect x="82"  y="134" width="36" height="7" rx="2.5"/>
    <path d="M86,143 L83,163 L117,163 L114,143 Z"/>
    <rect x="77"  y="165" width="46" height="7" rx="2.5"/>
    <path d="M73,174 L65,185 L135,185 L127,174 Z"/>
    <rect x="61"  y="187" width="78" height="7" rx="3.5"/>
  </g>

  <!-- Séparateur vertical discret entre marque et texte -->
  <line x1="88" y1="18" x2="88" y2="70"
        stroke="#C9A84C" stroke-width="0.6" opacity="0.35"/>

  <!-- ══ TEXTE (à droite de la marque) ══ -->

  <!-- Label "CANNES" -->
  <text x="100" y="34"
        font-family="'Montserrat','Arial Narrow','Arial',sans-serif"
        font-weight="700"
        font-size="9"
        letter-spacing="4"
        fill="#C9A84C">CANNES</text>

  <!-- Filet séparateur or (sous CANNES) -->
  <line x1="100" y1="41" x2="258" y2="41"
        stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>

  <!-- "ÉCHECS" — taille principale -->
  <text x="100" y="73"
        font-family="'Cormorant Garamond','Cormorant','Garamond','Georgia',serif"
        font-weight="700"
        font-size="36"
        letter-spacing="3"
        fill="#FAF8F4">ÉCHECS</text>

</svg>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><link href="fonts.css" rel="stylesheet"><style>
:root{--navy:#141F43;--navy2:#1C2A58;--navy3:#0D1530;--goldL:#C9B06A;--goldXL:#E3CF94}
*{margin:0;padding:0;box-sizing:border-box} html,body{width:1920px;height:1080px;overflow:hidden;background:var(--navy)}
#st{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,var(--navy2),var(--navy3) 78%);font-family:Montserrat,sans-serif;color:#fff}
#cam{position:absolute;inset:0;transform-origin:50% 45%}
.abs{position:absolute}
.g{background:linear-gradient(180deg,var(--goldXL) 0%,var(--goldL) 45%,#A88F4E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.head{font-weight:900;text-transform:uppercase;line-height:.95;text-shadow:0 6px 40px rgba(13,21,48,.6)}
.emed{perspective:900px}
.spk{position:absolute;border-radius:50%;background:#F3E3B0;box-shadow:0 0 8px 2px rgba(227,207,148,.7)}
.burst{position:absolute;width:900px;height:260px;margin:-130px 0 0 -450px;background:radial-gradient(ellipse at center,rgba(227,207,148,.32),transparent 65%);opacity:0}
#oth{left:140px;right:140px;top:905px;text-align:center;font-weight:800;font-size:25px;line-height:1.65;text-transform:uppercase;letter-spacing:.03em;color:var(--goldXL)}
#oth .dot{color:rgba(255,255,255,.55);margin:0 6px}
#frame{position:absolute;inset:28px;border:2px solid rgba(201,176,106,.55)}
</style></head><body><div id="st">
<div class="abs" id="eglow" style="inset:0;background:linear-gradient(105deg,transparent 30%,rgba(29,62,145,.35) 42%,rgba(255,255,255,.10) 50%,rgba(226,35,26,.30) 58%,transparent 70%)"></div>
<div id="cam">
%%SPK%%
<div class="burst" style="left:960px;top:235px"></div><div class="burst" style="left:960px;top:475px"></div><div class="burst" style="left:960px;top:715px"></div>
%%MED%%
<div class="abs" id="edfh" style="left:0;right:0;top:58px;text-align:center">
  <div class="head" style="font-size:52px;white-space:nowrap">Des joueurs et un entraîneur <span class="g">en équipe de France</span></div>
  <div id="eflag" style="margin:16px auto 0;width:240px;height:8px;display:flex"><div style="flex:1;background:#1D3E91"></div><div style="flex:1;background:#fff"></div><div style="flex:1;background:#E2231A"></div></div>
</div>
<div class="abs" id="oth">%%OTH%%</div>
</div>
<div id="frame"></div>
<div id="fl" style="position:absolute;inset:0;background:#fff;opacity:0"></div>
</div>
<script>
const BEAT=60/128,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lin=(t,a,b)=>cl((t-a)/(b-a)),eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
// chaque rangée arrive sur un temps fort (temps 1, 3, 5) ; vague gauche→droite, puis droite→gauche, puis gauche→droite
const ROW0=[BEAT,3*BEAT,5*BEAT], STAG=.055, WAVE=3.85;
function render(t){
  $('#cam').style.transform=`scale(${1+.035*eo(lin(t,0,5.6))})`;
  $$('.spk').forEach(e=>{const s=+e.dataset.s,p=+e.dataset.p,x=+e.dataset.x,y=+e.dataset.y-t*28*s;
    const tw=.5+.5*Math.sin(t*(2+3*s)+p), sz=2+3*s;
    e.style.cssText=`left:${x+Math.sin(t*.8+p)*10}px;top:${y}px;width:${sz}px;height:${sz}px;opacity:${lin(t,.15,1)*(.15+.75*tw)*s}`});
  $$('.burst').forEach((b,r)=>{const a=ROW0[r]+.25; b.style.opacity=.9*lin(t,a,a+.15)*(1-lin(t,a+.15,a+.9)); b.style.transform=`scaleX(${.6+.6*eo(lin(t,a,a+.9))})`});
  $$('.emed').forEach((c,i)=>{
    const r=+c.dataset.row,j=+c.dataset.j,n=+c.dataset.n, ord=r==1?n-1-j:j, a=ROW0[r]+ord*STAG;
    const p=back(lin(t,a,a+.5)), e=eo(lin(t,a,a+.45));
    const ring=c.querySelector('.ering'), ph=c.querySelector('.eph');
    // anneau doré qui se dessine puis tourne lentement
    const A=360*eo(lin(t,a,a+.42)), rot=-90+t*35;
    ring.style.background=`conic-gradient(from ${rot}deg,#F3E3B0 0deg,var(--goldL) ${A*.35}deg,#8a7440 ${A*.7}deg,#F3E3B0 ${A}deg,transparent ${A}deg)`;
    ring.style.opacity=lin(t,a,a+.06);
    ring.style.transform=`translateY(${(1-p)*-46}px) rotateY(${(1-e)*75}deg) scale(${.55+.45*p})`;
    ph.style.opacity=lin(t,a+.06,a+.26); ph.style.backgroundColor='';
    ph.style.transform=`scale(${1+.18*(1-eo(lin(t,a+.06,a+.6)))})`;
    // onde dorée à l'impact
    const g=c.querySelector('.eglint'), gq=lin(t,a+.38,a+.95);
    g.style.opacity=gq>0&&gq<1?.9*(1-gq):0; g.style.transform=`scale(${1+.55*eo(gq)})`;
    // reflet : à l'arrivée, puis une vague de lumière sur toute l'équipe
    const cx=parseFloat(c.style.left)/1920, s1=lin(t,a+.32,a+.85), s2=lin(t,WAVE+cx*.7,WAVE+cx*.7+.5);
    const sh=s2>0?s2:s1; c.querySelector('.eshine').style.transform=`translateX(${-150+300*sh}%)`;
    const nm=c.querySelector('.enm'), q=eo(lin(t,a+.28,a+.6));
    nm.style.opacity=q; nm.style.transform=`translateY(${(1-q)*16}px)`;
    c.style.transform=`translateY(${Math.sin((t+i*.7)*1.4)*4*lin(t,a+.5,a+1.2)}px)`});
  $$('#oth .on, #oth .dot').forEach((e,i)=>{const a=3.05+i*.05,p=eo(lin(t,a,a+.35)); e.style.opacity=p; e.style.display='inline-block'; e.style.transform=`translateY(${(1-p)*14}px)`});
  const h=back(lin(t,0,.45)); $('#edfh').style.opacity=lin(t,0,.12); $('#edfh').style.transform=`scale(${.8+.2*h})`;
  $('#fl').style.opacity=t<.3?.6*(1-t/.3):0;
  $('#eflag').style.width=eo(lin(t,.2,.7))*240+'px'; $('#eglow').style.transform=`translateX(${-1400+t*520}px)`;
}
window.render=render; render(0);
</script></body></html>

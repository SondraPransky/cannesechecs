<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cannes Échecs — Logo vertical complet
  VERSION FOND CLAIR (pages intérieures, documents, impressions)
  Or #C9A84C + Noir #0F0E17
  Fond transparent — à placer sur #FAF8F4 ou blanc
  Note prod : convertir le texte en tracés (Inkscape/Figma) pour un rendu optimal hors web
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 272"
     role="img" aria-labelledby="logo-light-title">
  <title id="logo-light-title">Cannes Échecs</title>

  <!-- ══ MARQUE (identique, l'or fonctionne sur fond clair) ══ -->
  <g fill="#C9A84C">
    <path d="M98.5,80 C97.5,61 96.5,42 100,20
             C103.5,42 102.5,61 101.5,80 Z"/>
    <path d="M99,80 C89,65 74,48 62,36
             C70.5,46 86,63 101,79 Z"/>
    <path d="M99,79 C114,63 129.5,46 138,36
             C126,48 111,65 101,80 Z"/>
    <path d="M98,80 C82.5,71.5 62,64 38,61
             C61,59 80.5,67.5 102,78.5 Z"/>
    <path d="M98,78.5 C119.5,67.5 139,59 162,61
             C138,64 117.5,71.5 102,80 Z"/>
    <rect x="97.5" y="79" width="5" height="21"/>
    <circle cx="100" cy="112" r="13"/>
    <rect x="92"  y="127" width="16" height="5"/>
    <rect x="82"  y="134" width="36" height="7" rx="2.5"/>
    <path d="M86,143 L83,163 L117,163 L114,143 Z"/>
    <rect x="77"  y="165" width="46" height="7" rx="2.5"/>
    <path d="M73,174 L65,185 L135,185 L127,174 Z"/>
    <rect x="61"  y="187" width="78" height="7" rx="3.5"/>
  </g>

  <!-- ══ TEXTE (version fond clair) ══ -->

  <!-- Label "CANNES" — or doré (fonctionne sur fond clair) -->
  <text x="100" y="210"
        text-anchor="middle"
        font-family="'Montserrat','Arial Narrow','Arial',sans-serif"
        font-weight="700"
        font-size="10"
        letter-spacing="5.5"
        fill="#C9A84C">CANNES</text>

  <!-- Filet séparateur or (légèrement plus visible sur fond clair) -->
  <line x1="40" y1="218" x2="160" y2="218"
        stroke="#C9A84C" stroke-width="0.65" opacity="0.7"/>

  <!-- "ÉCHECS" — noir profond sur fond clair -->
  <text x="101" y="253"
        text-anchor="middle"
        font-family="'Cormorant Garamond','Cormorant','Garamond','Georgia',serif"
        font-weight="700"
        font-size="34"
        letter-spacing="4"
        fill="#0F0E17">ÉCHECS</text>

</svg>

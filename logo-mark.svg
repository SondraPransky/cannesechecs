<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cannes Échecs — Symbole (marque seule, sans texte)
  Usage : favicon, icône, élément décoratif
  Fond transparent — fonctionne sur fond sombre et clair
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"
     role="img" aria-labelledby="mark-title">
  <title id="mark-title">Cannes Échecs — Symbole</title>

  <g fill="#C9A84C">

    <!-- ══════════════════════════════════════════
         PALMES — 5 frondes rayonnantes
         Origine commune : (100, 80)
         Concept : palme de Cannes stylisée,
         intégrée comme couronne royale du roi
    ══════════════════════════════════════════ -->

    <!-- Fronde centrale (verticale, vers le haut) -->
    <path d="M98.5,80 C97.5,61 96.5,42 100,20
             C103.5,42 102.5,61 101.5,80 Z"/>

    <!-- Fronde gauche intérieure (~35° de la verticale) -->
    <path d="M99,80 C89,65 74,48 62,36
             C70.5,46 86,63 101,79 Z"/>

    <!-- Fronde droite intérieure (~35° de la verticale) -->
    <path d="M99,79 C114,63 129.5,46 138,36
             C126,48 111,65 101,80 Z"/>

    <!-- Fronde gauche extérieure (~62°, légèrement retombante) -->
    <path d="M98,80 C82.5,71.5 62,64 38,61
             C61,59 80.5,67.5 102,78.5 Z"/>

    <!-- Fronde droite extérieure (~62°, légèrement retombante) -->
    <path d="M98,78.5 C119.5,67.5 139,59 162,61
             C138,64 117.5,71.5 102,80 Z"/>

    <!-- ══════════════════════════════════════════
         ROI D'ÉCHECS — pièce stylisée
         La croix traditionnelle est remplacée
         par les frondes de palmier ci-dessus.
         Séparations visibles entre éléments
         pour lisibilité à petite taille.
    ══════════════════════════════════════════ -->

    <!-- Tige (connecte palme → tête) -->
    <rect x="97.5" y="79" width="5" height="21"/>

    <!-- Tête -->
    <circle cx="100" cy="112" r="13"/>

    <!-- [espace naturel — y=125 à y=127] -->

    <!-- Gorge étroite -->
    <rect x="92" y="127" width="16" height="5"/>

    <!-- [espace naturel — y=132 à y=134] -->

    <!-- Collerette haute -->
    <rect x="82" y="134" width="36" height="7" rx="2.5"/>

    <!-- [espace naturel — y=141 à y=143] -->

    <!-- Corps (trapèze légèrement évasé vers le bas) -->
    <path d="M86,143 L83,163 L117,163 L114,143 Z"/>

    <!-- [espace naturel — y=163 à y=165] -->

    <!-- Collerette basse -->
    <rect x="77" y="165" width="46" height="7" rx="2.5"/>

    <!-- [espace naturel — y=172 à y=174] -->

    <!-- Socle (trapèze large) -->
    <path d="M73,174 L65,185 L135,185 L127,174 Z"/>

    <!-- [espace naturel — y=185 à y=187] -->

    <!-- Plateau (base plate) -->
    <rect x="61" y="187" width="78" height="7" rx="3.5"/>

  </g>
</svg>
